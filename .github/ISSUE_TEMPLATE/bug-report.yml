name: Report a problem
description: Tell us what went wrong while using mewvi.
body:
  - type: markdown
    attributes:
      value: Please leave out private links, personal files, cookies and signed download links. Use Copy error details in mewvi when an error offers it.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: For example, save selected Shorts as a ZIP, then return after refreshing.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps, what you expected, and where you got stuck. A permitted public sample is helpful for link problems.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: For example, Safari on iPhone or Edge on Windows.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error details or screenshot (optional)
      description: You can paste the safe details copied from mewvi. Say whether refreshing or retrying changed anything.
